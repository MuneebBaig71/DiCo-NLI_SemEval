[project]
name = "dl-assignment"
version = "0.1.0"
description = "DiCo-NLI (SemEval-2027 Task 2) Assignment 1: EDA and baselines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "scipy",
    "scikit-learn>=1.3",
    "matplotlib",
    "spacy>=3.7",
    "torch>=2.3",
    "transformers>=4.44",
    "sentence-transformers",
    "sentencepiece",
    "protobuf",
    "ipykernel",
]

[project.scripts]
dl-assignment = "dl_assignment:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
